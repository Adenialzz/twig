[package]
name = "twig-cli"
version = "0.1.0"
edition = "2024"
description = "用 Git Worktree 和 tmux 管理独立任务环境"

[[bin]]
name = "twig"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
ratatui = "0.29"
# 使用同步 poll 后端，避免 macOS 同时收到缩放和输入时丢失边沿通知。
crossterm = { version = "0.28", features = ["use-dev-tty"] }
tungstenite = "0.26"
libc = "0.2"

[dev-dependencies]
alacritty_terminal = "0.26.0"
