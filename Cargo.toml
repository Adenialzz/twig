[package]
name = "twig-cli"
version = "0.1.0"
edition = "2024"
description = "用 Git Worktree 和 tmux 管理独立任务环境"

[[bin]]
name = "twig"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
# 使用同步 poll 后端，避免 macOS 同时收到缩放和输入时丢失边沿通知。
crossterm = { version = "0.28", features = ["use-dev-tty"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
libc = "0.2"

alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"

# Agent 正文渲染（从 Codex 提取，见 third_party/codex）。
pulldown-cmark = "0.10"
textwrap = "0.16.2"
unicode-width = "0.2"
regex-lite = "0.1"
dirs = "6"
url = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
urlencoding = "2"
tracing = "0.1"
prost = "0.13"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
